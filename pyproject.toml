[project]
name = "dw-companion"
version = "0.1.0"
description = "Dungeon World rules site and AI assistant (unofficial)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
extend-exclude = ["vendor", "site", "STORIES"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT", "N"]

[tool.ruff.lint.per-file-ignores]
"ingestion/**" = ["RUF001"]
"ingestion/overrides.py" = ["E501"]
"ingestion/tests/**" = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["backend", "ingestion", "evals"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["backend", "ingestion", "evals"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
