name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run pyright

      - name: Test
        run: uv run pytest

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: "1"

      - name: Check links
        run: npm run check-links

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t dw-companion:ci .

      - name: Start container
        run: |
          docker run -d --name app -p 8080:8080 \
            -e OPENROUTER_API_KEY=ci-placeholder-not-a-key \
            -e MODEL_ROUTER=ci/placeholder \
            -e MODEL_CLASSIFIER=ci/placeholder \
            -e MODEL_ANSWER=ci/placeholder \
            -e MODEL_EMBEDDINGS="$(jq -r .embedding_model data/index/manifest.json)" \
            dw-companion:ci

      - name: Smoke test
        run: infra/smoke.sh http://127.0.0.1:8080

      - name: Container logs
        if: failure()
        run: docker logs app
